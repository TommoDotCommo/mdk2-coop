name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag (for example v0.4.0-alpha)'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  # Keep the project/policy slugs configurable without editing the workflow.
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mdk2-coop' }}
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
  PYTHON_VERSION: '3.12.8'
  MINGW_GCC_VERSION: '13.2.0-6ubuntu1+26.1'
  MINGW_HEADERS_VERSION: '11.0.1-3build1'
  MINGW_BINUTILS_VERSION: '2.41.90.20240122-1ubuntu1+11.4'

jobs:
  build:
    # Pin the ubuntu-latest family to an LTS instead of accepting image migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and set build epoch
        id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned cross toolchain
        run: |
          # An immutable Ubuntu snapshot retains these exact package versions.
          echo 'deb https://snapshot.ubuntu.com/ubuntu/20240501T000000Z noble main universe' > "$RUNNER_TEMP/toolchain.list"
          apt_opts=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/toolchain.list" -o 'Dir::Etc::sourceparts=-' -o 'Acquire::Check-Valid-Until=false')
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install --yes --no-install-recommends --allow-downgrades \
            "gcc-mingw-w64-base=$MINGW_GCC_VERSION" \
            "gcc-mingw-w64-i686-win32=$MINGW_GCC_VERSION" \
            "gcc-mingw-w64-i686-win32-runtime=$MINGW_GCC_VERSION" \
            "g++-mingw-w64-x86-64-win32=$MINGW_GCC_VERSION" \
            "gcc-mingw-w64-x86-64-win32=$MINGW_GCC_VERSION" \
            "gcc-mingw-w64-x86-64-win32-runtime=$MINGW_GCC_VERSION" \
            "mingw-w64-common=$MINGW_HEADERS_VERSION" \
            "mingw-w64-i686-dev=$MINGW_HEADERS_VERSION" \
            "mingw-w64-x86-64-dev=$MINGW_HEADERS_VERSION" \
            "binutils-mingw-w64-i686=$MINGW_BINUTILS_VERSION" \
            "binutils-mingw-w64-x86-64=$MINGW_BINUTILS_VERSION"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libcurl4-openssl-dev osslsigncode
          # Avoid a runner's preinstalled posix-thread alternative changing the output.
          mkdir -p "$RUNNER_TEMP/mingw-bin"
          ln -s /usr/bin/i686-w64-mingw32-gcc-win32 "$RUNNER_TEMP/mingw-bin/i686-w64-mingw32-gcc"
          ln -s /usr/bin/x86_64-w64-mingw32-g++-win32 "$RUNNER_TEMP/mingw-bin/x86_64-w64-mingw32-g++"
          echo "$RUNNER_TEMP/mingw-bin" >> "$GITHUB_PATH"
      - name: Lint workflow
        run: |
          bash .github/scripts/install-actionlint.sh "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= .github/workflows/release.yml
      - name: Linux game-free gates
        run: python3 .github/scripts/linux-gates.py
      - name: Build and check unsigned release
        env:
          RELEASE_OUT: local/release-unsigned
        run: |
          bash tools/release.sh "$VERSION"
          python3 tools/check_release_package.py "$RELEASE_OUT/mdk2-coop-$VERSION.zip"
      - name: Upload unsigned downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            local/release-unsigned/*.zip
            local/release-unsigned/*.exe
            local/release-unsigned/*.sha256
            local/release-unsigned/NEXUS-*.txt
      - name: Check signing configuration
        id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [[ -n "$SIGNPATH_API_TOKEN" && -n "$SIGNPATH_ORGANIZATION_ID" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SKIP SignPath and draft release: SIGNPATH_API_TOKEN or SIGNPATH_ORGANIZATION_ID is unset; unsigned artifacts are available.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare stage A binaries
        if: steps.signing.outputs.enabled == 'true'
        run: bash tools/release.sh "$VERSION" prepare
      - name: Upload stage A signing input
        if: steps.signing.outputs.enabled == 'true'
        id: stage-a
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-stage-a-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            local/release/mdk2-coop-${{ steps.version.outputs.version }}/dinput8.dll
            local/release/mdk2-coop-${{ steps.version.outputs.version }}/install-policy.exe
            local/release/mdk2-coop-${{ steps.version.outputs.version }}/MDK2-Coop-Setup.exe
      - name: SignPath stage A (manual approval)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.stage-a.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: local/signed-a
      - name: Verify stage A and embed signed payload
        if: steps.signing.outputs.enabled == 'true'
        env:
          RELEASE_REQUIRE_SIGNED: '1'
        run: |
          for file in dinput8.dll install-policy.exe MDK2-Coop-Setup.exe; do
            osslsigncode verify -in "local/signed-a/$file"
            cp "local/signed-a/$file" "local/release/mdk2-coop-$VERSION/$file"
          done
          bash tools/release.sh "$VERSION" assemble
      - name: Upload stage B signing input
        if: steps.signing.outputs.enabled == 'true'
        id: stage-b
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-stage-b-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: local/release/MDK2-Coop-Setup.exe
      - name: SignPath stage B (manual approval)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.stage-b.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: local/signed-b
      - name: Verify stage B and finalize signed downloads
        if: steps.signing.outputs.enabled == 'true'
        env:
          RELEASE_REQUIRE_SIGNED: '1'
        run: |
          osslsigncode verify -in local/signed-b/MDK2-Coop-Setup.exe
          cp local/signed-b/MDK2-Coop-Setup.exe local/release/MDK2-Coop-Setup.exe
          bash tools/release.sh "$VERSION" finalize
          python3 tools/check_release_package.py "local/release/mdk2-coop-$VERSION.zip" --require-signed
      - name: Upload signed downloads
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            local/release/*.zip
            local/release/*.exe
            local/release/*.sha256
            local/release/NEXUS-*.txt
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: game-free-reports
          path: local/regression/

  draft:
    needs: build
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-${{ needs.build.outputs.version }}
          path: release
      - name: Create a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$VERSION" --verify-tag --draft --title "$VERSION" --generate-notes \
            release/MDK2-Coop-Setup.exe release/MDK2-Coop-Setup.exe.sha256 \
            "release/mdk2-coop-$VERSION.zip" "release/mdk2-coop-$VERSION.zip.sha256"
