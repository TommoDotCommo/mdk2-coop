name: Feature request
description: An idea for something the mod could do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like, and what it would let you and your friends do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: When it would help
      description: A moment in a game where you missed it, if there was one.
